name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 24 ships npm 11,
      # but upgrade explicitly so the OIDC token exchange is guaranteed).
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Publish @plumbus/mcp BEFORE @plumbus/core so the optional peer
      # dependency declared by core resolves immediately for consumers.
      - name: Publish @plumbus/mcp
        working-directory: packages/mcp
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Publish @plumbus/core
        working-directory: packages/plumbus-core
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi

      # Publish @plumbus/api AFTER @plumbus/core (peer: @plumbus/core 0.4.x).
      - name: Publish @plumbus/api
        working-directory: packages/api
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Publish @plumbus/knowledge-base
        working-directory: packages/knowledge-base
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Publish @plumbus/chat
        working-directory: packages/chat
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Publish @plumbus/ui
        working-directory: packages/ui
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Publish @plumbus/chat-ui
        working-directory: packages/chat-ui
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Publish @plumbus/browser-extension
        working-directory: packages/browser-extension
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks
          fi
