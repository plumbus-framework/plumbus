name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # The core suite includes *.pg.test.ts files that need a real Postgres
    # (durable harness, tenant data planes). They fail, not skip, without one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUMBUS_TEST_PG_HOST: 127.0.0.1
      PLUMBUS_TEST_PG_PORT: "5432"
      PLUMBUS_TEST_PG_USER: postgres
      PLUMBUS_TEST_PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history plus branch refs: the dist-tag below is derived from
          # which branch contains the tagged commit.
          fetch-depth: 0

      # Tags carry no branch, so look at which branches contain the tagged
      # commit. On main → `latest`. Anywhere else → the branch name, sanitised
      # into a valid npm dist-tag (lowercase, `/` and other punctuation → `-`).
      - name: Resolve npm dist-tag
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            dist_tag=latest
          else
            branch=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' \
              | sed 's#^origin/##' | grep -v '^HEAD$' | grep -v '^main$' | head -n 1 || true)
            if [ -z "$branch" ]; then
              echo "::error::Tagged commit $GITHUB_SHA is not on any branch; refusing to guess a dist-tag"
              exit 1
            fi
            dist_tag=$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
            if [ -z "$dist_tag" ] || [ "$dist_tag" = latest ]; then
              echo "::error::Branch '$branch' does not yield a usable dist-tag"
              exit 1
            fi
          fi
          echo "Publishing under dist-tag: $dist_tag"
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1 (OIDC trusted-publishing floor).
          # Do NOT run `npm install -g npm@latest` — in-place self-upgrades
          # on GHA runners have been leaving broken npm trees (missing
          # `sigstore` / `promise-retry`), which then crash provenance
          # signing inside libnpmpublish during `pnpm publish`.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Offline Laya service contract tests use Python without model dependencies.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Publish @plumbus/mcp BEFORE @plumbus/core so the optional peer
      # dependency declared by core resolves immediately for consumers.
      - name: Publish @plumbus/mcp
        working-directory: packages/mcp
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --access public --no-git-checks --tag "$DIST_TAG"
          fi

      # Publish @plumbus/ai-bedrock BEFORE @plumbus/core (optional peer of core).
      - name: Publish @plumbus/ai-bedrock
        working-directory: packages/ai-bedrock
