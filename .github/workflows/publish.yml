name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Publish @plumbus/mcp BEFORE @plumbus/core so the optional peer
      # dependency declared by core resolves immediately for consumers.
      - name: Publish @plumbus/mcp
        working-directory: packages/mcp
        run: pnpm publish --access public --no-git-checks

      - name: Publish @plumbus/core
        working-directory: packages/plumbus-core
        run: pnpm publish --access public --no-git-checks

      - name: Publish @plumbus/ui
        working-directory: packages/ui
        run: pnpm publish --access public --no-git-checks
