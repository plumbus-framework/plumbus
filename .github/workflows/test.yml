name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    # The integration fixtures require PostgreSQL 16 from Ubuntu 24.04's repositories.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Offline Laya service contract tests use Python without model dependencies.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Integration fixtures launch their own isolated Redis/PostgreSQL processes.
      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server postgresql-16
          redis-server --version
          /usr/lib/postgresql/16/bin/initdb --version
          /usr/lib/postgresql/16/bin/pg_ctl --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
